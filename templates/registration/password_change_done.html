{% extends 'base_landing.html' %}

{% block title %}Password Changed - PPEDP{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 bg-emerald-500 rounded-2xl shadow-lg flex items-center justify-center transform -rotate-6">
                <i data-lucide="check-circle" class="w-8 h-8 text-white"></i>
            </div>
        </div>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Password Changed Successfully</h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            Your password has been securely updated.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-elevated sm:rounded-2xl sm:px-10 border border-gray-100 text-center">
            <a href="{% url 'dashboard' %}" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-soft text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all">
                Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
