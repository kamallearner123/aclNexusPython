<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Apt Computing Labs Nexus - App Hub{% endblock %}</title>
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb', // Primary
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    boxShadow: {
                        'soft': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
                        'elevated': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'glow': '0 0 20px rgba(37, 99, 235, 0.15)',
                    }
                }
            }
        }
    </script>
    
    {% load static %}
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">
    
    <!-- Subtle Background Elements -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-brand-400 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-emerald-400 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob animation-delay-2000"></div>
    </div>

    <!-- Top Nav Minimal -->
    <header class="h-20 flex items-center justify-between px-8 z-10 w-full max-w-7xl mx-auto mt-4">
        <div class="flex items-center">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-8 w-auto mr-3 object-contain">
            <span class="font-bold text-xl tracking-tight text-gray-900">Apt Computing Labs</span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center p-2 rounded-full bg-white shadow-soft ring-1 ring-gray-900/5 px-4 py-2">
                <img src="https://ui-avatars.com/api/?name={{ request.user.email }}&background=random" alt="Avatar" class="h-6 w-6 rounded-full mr-2">
                <span class="text-sm font-medium">{{ request.user.first_name|default:request.user.email }}</span>
                <form action="{% url 'logout' %}" method="post" class="m-0 ml-4 pl-4 border-l border-gray-200">
                    {% csrf_token %}
                    <button type="submit" class="text-sm text-gray-500 hover:text-red-600 font-medium transition-colors">Logout</button>
                </form>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center z-10 w-full px-4 py-12">
        {% block content %}
        {% endblock %}
    </main>
    
    <footer class="py-8 text-center text-sm text-gray-500 z-10">
        &copy; {% now "Y" %} Apt Computing Labs. All rights reserved.
    </footer>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
