<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="embBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pcbTraceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#embBgGrad)" rx="16" />

  <!-- PCB Circuit Grid Lines -->
  <g stroke="url(#pcbTraceGrad)" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 60,60 L 220,60 L 280,120 L 320,120" />
    <path d="M 80,120 L 180,120 L 240,180 L 320,180" />
    <path d="M 60,390 L 200,390 L 260,330 L 320,330" />
    <path d="M 100,330 L 180,330 L 230,280 L 320,280" />
    <path d="M 740,60 L 580,60 L 520,120 L 480,120" />
    <path d="M 720,120 L 620,120 L 560,180 L 480,180" />
    <path d="M 740,390 L 600,390 L 540,330 L 480,330" />
    <path d="M 700,330 L 620,330 L 570,280 L 480,280" />
    
    <!-- Vertical bus traces -->
    <path d="M 360,30 L 360,150" />
    <path d="M 400,20 L 400,150" />
    <path d="M 440,30 L 440,150" />
    <path d="M 360,420 L 360,300" />
    <path d="M 400,430 L 400,300" />
    <path d="M 440,420 L 440,300" />
  </g>

  <!-- Test Points / Vias -->
  <g fill="#38bdf8" filter="url(#chipGlow)" opacity="0.8">
    <circle cx="220" cy="60" r="3.5" />
    <circle cx="180" cy="120" r="3" />
    <circle cx="200" cy="390" r="3.5" />
    <circle cx="580" cy="60" r="3.5" />
    <circle cx="620" cy="120" r="3" />
    <circle cx="600" cy="390" r="3.5" />
    <circle cx="360" cy="30" r="3" />
    <circle cx="440" cy="30" r="3" />
    <circle cx="360" cy="420" r="3" />
    <circle cx="440" cy="420" r="3" />
  </g>

  <!-- Central Microcontroller Chip (QFP / QFN Package) -->
  <g transform="translate(320, 145)">
    <!-- Outer Chip Body -->
    <rect x="0" y="0" width="160" height="160" rx="12" fill="url(#chipGrad)" stroke="#334155" stroke-width="2.5" />
    <!-- Pin 1 Dot -->
    <circle cx="18" cy="18" r="4" fill="#64748b" />

    <!-- Inner Silicon Core Glow -->
    <rect x="25" y="25" width="110" height="110" rx="8" fill="#0c101d" stroke="url(#accentGlow)" stroke-width="2" filter="url(#chipGlow)" />

    <!-- ARM Cortex Core Graphics -->
    <text x="80" y="70" fill="#f8fafc" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">ARM CORTEX-M</text>
    <text x="80" y="90" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10" font-weight="600" text-anchor="middle">BARE-METAL &amp; RTOS</text>
    <text x="80" y="112" fill="#10b981" font-family="'Fira Code', monospace" font-size="9" font-weight="500" text-anchor="middle">&lt;Embedded C / C++&gt;</text>

    <!-- Chip Pins - Left & Right -->
    <g fill="url(#goldPin)">
      <!-- Left Pins -->
      <rect x="-14" y="20" width="14" height="6" rx="1.5" />
      <rect x="-14" y="38" width="14" height="6" rx="1.5" />
      <rect x="-14" y="56" width="14" height="6" rx="1.5" />
      <rect x="-14" y="74" width="14" height="6" rx="1.5" />
      <rect x="-14" y="92" width="14" height="6" rx="1.5" />
      <rect x="-14" y="110" width="14" height="6" rx="1.5" />
      <rect x="-14" y="128" width="14" height="6" rx="1.5" />

      <!-- Right Pins -->
      <rect x="160" y="20" width="14" height="6" rx="1.5" />
      <rect x="160" y="38" width="14" height="6" rx="1.5" />
      <rect x="160" y="56" width="14" height="6" rx="1.5" />
      <rect x="160" y="74" width="14" height="6" rx="1.5" />
      <rect x="160" y="92" width="14" height="6" rx="1.5" />
      <rect x="160" y="110" width="14" height="6" rx="1.5" />
      <rect x="160" y="128" width="14" height="6" rx="1.5" />

      <!-- Top Pins -->
      <rect x="20" y="-14" width="6" height="14" rx="1.5" />
      <rect x="38" y="-14" width="6" height="14" rx="1.5" />
      <rect x="56" y="-14" width="6" height="14" rx="1.5" />
      <rect x="74" y="-14" width="6" height="14" rx="1.5" />
      <rect x="92" y="-14" width="6" height="14" rx="1.5" />
      <rect x="110" y="-14" width="6" height="14" rx="1.5" />
      <rect x="128" y="-14" width="6" height="14" rx="1.5" />

      <!-- Bottom Pins -->
      <rect x="20" y="160" width="6" height="14" rx="1.5" />
      <rect x="38" y="160" width="6" height="14" rx="1.5" />
      <rect x="56" y="160" width="6" height="14" rx="1.5" />
      <rect x="74" y="160" width="6" height="14" rx="1.5" />
      <rect x="92" y="160" width="6" height="14" rx="1.5" />
      <rect x="110" y="160" width="6" height="14" rx="1.5" />
      <rect x="128" y="160" width="6" height="14" rx="1.5" />
    </g>
  </g>

  <!-- Peripheral badges in 4 corners -->
  <g font-family="'Fira Code', monospace" font-size="11" font-weight="700">
    <!-- Top Left: GPIO / NVIC -->
    <rect x="70" y="45" width="120" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="130" y="62" fill="#38bdf8" text-anchor="middle">GPIO • NVIC</text>

    <!-- Bottom Left: RTOS / DMA -->
    <rect x="70" y="375" width="130" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <text x="135" y="392" fill="#10b981" text-anchor="middle">FreeRTOS • DMA</text>

    <!-- Top Right: I2C / SPI / CAN -->
    <rect x="600" y="45" width="130" height="26" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" opacity="0.9" />
    <text x="665" y="62" fill="#f59e0b" text-anchor="middle">CAN • SPI • I2C</text>

    <!-- Bottom Right: MISRA / Safety -->
    <rect x="590" y="375" width="140" height="26" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" opacity="0.9" />
    <text x="660" y="392" fill="#ef4444" text-anchor="middle">MISRA-C • Safety</text>
  </g>
</svg>
