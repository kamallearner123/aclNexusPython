<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="cBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#162032" />
    </linearGradient>
    <linearGradient id="traceGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="chipBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="accentFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldLead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="cSiliconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#cBgGrad)" rx="16" />

  <!-- PCB Copper Traces -->
  <g stroke="url(#traceGradC)" stroke-width="1.8" fill="none" opacity="0.65">
    <path d="M 50,70 L 210,70 L 270,130 L 310,130" />
    <path d="M 70,130 L 170,130 L 230,190 L 310,190" />
    <path d="M 50,380 L 190,380 L 250,320 L 310,320" />
    <path d="M 90,320 L 170,320 L 220,270 L 310,270" />
    <path d="M 750,70 L 590,70 L 530,130 L 490,130" />
    <path d="M 730,130 L 630,130 L 570,190 L 490,190" />
    <path d="M 750,380 L 610,380 L 550,320 L 490,320" />
    <path d="M 710,320 L 630,320 L 580,270 L 490,270" />
    <!-- Vertical Address & Data Bus -->
    <path d="M 350,30 L 350,140" />
    <path d="M 400,15 L 400,140" />
    <path d="M 450,30 L 450,140" />
    <path d="M 350,420 L 350,310" />
    <path d="M 400,435 L 400,310" />
    <path d="M 450,420 L 450,310" />
  </g>

  <!-- Test Points & Vias -->
  <g fill="#38bdf8" filter="url(#cSiliconGlow)" opacity="0.9">
    <circle cx="210" cy="70" r="3.5" fill="#f97316" />
    <circle cx="170" cy="130" r="3" />
    <circle cx="190" cy="380" r="3.5" fill="#10b981" />
    <circle cx="590" cy="70" r="3.5" fill="#f97316" />
    <circle cx="630" cy="130" r="3" />
    <circle cx="610" cy="380" r="3.5" fill="#10b981" />
    <circle cx="350" cy="30" r="3" />
    <circle cx="450" cy="30" r="3" />
    <circle cx="350" cy="420" r="3" />
    <circle cx="450" cy="420" r="3" />
  </g>

  <!-- Central Microcontroller Package -->
  <g transform="translate(315, 140)">
    <!-- Main IC Package Body -->
    <rect x="0" y="0" width="170" height="170" rx="14" fill="url(#chipBodyGrad)" stroke="#334155" stroke-width="2.5" />
    <!-- Pin 1 Chamfer Marker -->
    <circle cx="20" cy="20" r="4.5" fill="#64748b" />

    <!-- Silicon Die Window -->
    <rect x="25" y="25" width="120" height="120" rx="10" fill="#090d16" stroke="url(#accentFlame)" stroke-width="2" filter="url(#cSiliconGlow)" />

    <!-- C Architecture Branding -->
    <text x="85" y="65" fill="#f97316" font-family="'Fira Code', monospace" font-size="20" font-weight="800" text-anchor="middle">{ C }</text>
    <text x="85" y="87" fill="#f8fafc" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">EMBEDDED C</text>
    <text x="85" y="105" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" text-anchor="middle">BARE-METAL &amp; HAL</text>
    <text x="85" y="124" fill="#10b981" font-family="'Fira Code', monospace" font-size="8.5" font-weight="500" text-anchor="middle">*REG |= (1 &lt;&lt; PIN)</text>

    <!-- Chip Gold Lead Pins -->
    <g fill="url(#goldLead)">
      <!-- Left Pins -->
      <rect x="-14" y="22" width="14" height="6" rx="1.5" />
      <rect x="-14" y="42" width="14" height="6" rx="1.5" />
      <rect x="-14" y="62" width="14" height="6" rx="1.5" />
      <rect x="-14" y="82" width="14" height="6" rx="1.5" />
      <rect x="-14" y="102" width="14" height="6" rx="1.5" />
      <rect x="-14" y="122" width="14" height="6" rx="1.5" />
      <rect x="-14" y="142" width="14" height="6" rx="1.5" />

      <!-- Right Pins -->
      <rect x="170" y="22" width="14" height="6" rx="1.5" />
      <rect x="170" y="42" width="14" height="6" rx="1.5" />
      <rect x="170" y="62" width="14" height="6" rx="1.5" />
      <rect x="170" y="82" width="14" height="6" rx="1.5" />
      <rect x="170" y="102" width="14" height="6" rx="1.5" />
      <rect x="170" y="122" width="14" height="6" rx="1.5" />
      <rect x="170" y="142" width="14" height="6" rx="1.5" />

      <!-- Top Pins -->
      <rect x="22" y="-14" width="6" height="14" rx="1.5" />
      <rect x="42" y="-14" width="6" height="14" rx="1.5" />
      <rect x="62" y="-14" width="6" height="14" rx="1.5" />
      <rect x="82" y="-14" width="6" height="14" rx="1.5" />
      <rect x="102" y="-14" width="6" height="14" rx="1.5" />
      <rect x="122" y="-14" width="6" height="14" rx="1.5" />
      <rect x="142" y="-14" width="6" height="14" rx="1.5" />

      <!-- Bottom Pins -->
      <rect x="22" y="170" width="6" height="14" rx="1.5" />
      <rect x="42" y="170" width="6" height="14" rx="1.5" />
      <rect x="62" y="170" width="6" height="14" rx="1.5" />
      <rect x="82" y="170" width="6" height="14" rx="1.5" />
      <rect x="102" y="170" width="6" height="14" rx="1.5" />
      <rect x="122" y="170" width="6" height="14" rx="1.5" />
      <rect x="142" y="170" width="6" height="14" rx="1.5" />
    </g>
  </g>

  <!-- High-End Curriculum Architectural Badges -->
  <g font-family="'Fira Code', monospace" font-size="11" font-weight="700">
    <!-- Top Left: Toolchains / Cross-Compilers -->
    <rect x="55" y="45" width="160" height="28" rx="7" fill="#0f172a" stroke="#f97316" stroke-width="1.3" opacity="0.95" />
    <text x="135" y="63" fill="#f97316" text-anchor="middle">GCC • GDB • CMake</text>

    <!-- Bottom Left: Reactive / FSMs -->
    <rect x="55" y="375" width="170" height="28" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" opacity="0.95" />
    <text x="140" y="393" fill="#38bdf8" text-anchor="middle">Events • FSM • Timers</text>

    <!-- Top Right: STM32 / ARM Silicon -->
    <rect x="580" y="45" width="165" height="28" rx="7" fill="#0f172a" stroke="#10b981" stroke-width="1.3" opacity="0.95" />
    <text x="662" y="63" fill="#10b981" text-anchor="middle">STM32 • ARM Cortex</text>

    <!-- Bottom Right: MISRA-C / Layered Architecture -->
    <rect x="575" y="375" width="170" height="28" rx="7" fill="#0f172a" stroke="#fbbf24" stroke-width="1.3" opacity="0.95" />
    <text x="660" y="393" fill="#fbbf24" text-anchor="middle">MISRA-C • HAL / BSP</text>
  </g>
</svg>
