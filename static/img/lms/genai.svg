<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" />

  <!-- Abstract Network Nodes -->
  <g opacity="0.3" stroke="#94a3b8" stroke-width="1.5">
    <line x1="120" y1="90" x2="280" y2="160" />
    <line x1="280" y1="160" x2="400" y2="100" />
    <line x1="400" y1="100" x2="520" y2="200" />
    <line x1="520" y1="200" x2="680" y2="130" />
    <line x1="280" y1="160" x2="320" y2="300" />
    <line x1="320" y1="300" x2="500" y2="320" />
    <line x1="500" y1="320" x2="680" y2="260" />
    <line x1="520" y1="200" x2="500" y2="320" />
  </g>

  <!-- Glowing Nodes -->
  <circle cx="120" cy="90" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="280" cy="160" r="8" fill="#818cf8" filter="url(#glow)" />
  <circle cx="400" cy="100" r="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="520" cy="200" r="10" fill="#c084fc" filter="url(#glow)" />
  <circle cx="680" cy="130" r="6" fill="#818cf8" filter="url(#glow)" />
  <circle cx="320" cy="300" r="9" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="500" cy="320" r="8" fill="#c084fc" filter="url(#glow)" />
  <circle cx="680" cy="260" r="7" fill="#38bdf8" filter="url(#glow)" />

  <!-- Center Hexagon Agent Core -->
  <polygon points="400,160 460,195 460,265 400,300 340,265 340,195" fill="#0f172a" stroke="url(#neonGlow)" stroke-width="4" filter="url(#glow)" />
  <circle cx="400" cy="230" r="22" fill="url(#neonGlow)" />
  
  <!-- Robot/Agent Head Icon In Center -->
  <path d="M392 222 h16 v16 h-16 z" fill="#0f172a" />
  <circle cx="396" cy="228" r="2" fill="#38bdf8" />
  <circle cx="404" cy="228" r="2" fill="#38bdf8" />

</svg>
